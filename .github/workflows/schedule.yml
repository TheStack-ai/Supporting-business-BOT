name: Bizinfo Bot Schedule

on:
  schedule:
    - cron: '0 23,9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run sends alerts; preview assesses without sending; verify checks without AI'
        type: choice
        options: [run, verify, recover, probe, preview]
        default: run
      recovery_since:
        description: 'For one-time recovery only: ISO time of the last successful run'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: sole-search-bot
  cancel-in-progress: false

jobs:
  run-bot:
    if: github.event_name == 'workflow_dispatch' || vars.BOT_STATE_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore durable encrypted bot state
        id: restore
        if: inputs.mode != 'recover' && inputs.mode != 'probe'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m src.state_archive restore data

      - name: Run or verify bot
        id: execute
        env:
          REQUEST_MODE: ${{ inputs.mode || 'run' }}
          RECOVERY_SINCE: ${{ inputs.recovery_since }}
          REQUIRE_DURABLE_STATE: 'true'
          BOT_DRY_RUN: ${{ inputs.mode == 'verify' }}
          BOT_PREVIEW_ONLY: ${{ inputs.mode == 'preview' }}
          BOT_PREVIEW_PATH: preview/notifications.json
          MAX_PROGRAMS_PER_RUN: ${{ inputs.mode == 'preview' && '8' || '40' }}
          BIZINFO_SUPPORT_KEY: ${{ secrets.BIZINFO_SUPPORT_KEY }}
          BIZINFO_EVENT_KEY: ${{ secrets.BIZINFO_EVENT_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFILE_REGIONS: ${{ secrets.PROFILE_REGIONS }}
          PROFILE_INTERESTS: ${{ secrets.PROFILE_INTERESTS }}
          PROFILE_KEYWORDS: ${{ secrets.PROFILE_KEYWORDS }}
          PROFILE_EXCLUDES: ${{ secrets.PROFILE_EXCLUDES }}
          PROFILE_MIN_SCORE: ${{ secrets.PROFILE_MIN_SCORE }}
        run: |
          if [ "$REQUEST_MODE" = probe ]; then
            python scripts/probe_bizinfo.py
          elif [ "$REQUEST_MODE" = recover ]; then
            test -n "$RECOVERY_SINCE"
            python -m src.recovery_state --since "$RECOVERY_SINCE" --data-dir data
          else
            python -m src.run_once
          fi

      - name: Persist durable encrypted bot state
        if: always() && ((inputs.mode == 'recover' && steps.execute.outcome == 'success') || ((inputs.mode == '' || inputs.mode == 'run') && steps.restore.outcome == 'success'))
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_MODE: ${{ inputs.mode || 'run' }}
        run: |
          if [ "$REQUEST_MODE" = recover ]; then
            python -m src.state_archive save data --initialize
          else
            python -m src.state_archive save data
          fi

      - name: Retain no-send notification preview
        if: inputs.mode == 'preview' && steps.execute.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: notification-preview-${{ github.run_id }}
          path: preview/notifications.json
          retention-days: 7
